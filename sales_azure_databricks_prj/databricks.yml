# This is a Databricks asset bundle definition for sales_azure_databricks_prj.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sales_azure_databricks_prj
  uuid: fa1e49c5-d8cc-4ab2-aa06-1161b13f5b74

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405611628632073.13.azuredatabricks.net
    variables:
      catalog: adb_eus_dev_0526
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405611628632073.13.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ravi.usit9@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ravi.usit9@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: adb_eus_dev_0526
      schema: prod
    permissions:
      - user_name: ravi.usit9@gmail.com
        level: CAN_MANAGE
